[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# MediaPipe model/wasm assets (added when the engine migrates to
# @mediapipe/tasks-vision) are content-hashed by filename, so they can be cached
# aggressively.
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
